<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" font-family="'Segoe UI', 'DejaVu Sans', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .t  { fill:#0b0b0b; font-size:15px; font-weight:600; }
      .s  { fill:#52514e; font-size:12px; }
      .h  { fill:#0b0b0b; font-size:13px; font-weight:700; letter-spacing:1.5px; }
      .ln { stroke:#52514e; stroke-width:1.6; fill:none; marker-end:url(#seta); }
      .bx { fill:#ffffff; stroke:#d6d4ce; stroke-width:1.2; }
      .ins{ fill:#eef5fd; stroke:#9ec5f4; stroke-width:1.2; }
      .out{ fill:#2a78d6; }
      .ot { fill:#ffffff; font-size:15px; font-weight:700; }
      .os { fill:#e8f1fc; font-size:12px; }
      .val{ fill:#f4f3ef; stroke:#d6d4ce; stroke-width:1.2; }
    </style>
  </defs>
  <rect width="1280" height="700" fill="#fcfcfb"/>

  <!-- trilha mensal -->
  <text x="24" y="38" class="h">MENSAL · emissão no dia 1, 00 UTC · alvo ERA5 0,25°</text>
  <rect x="24" y="52" width="196" height="196" rx="10" class="ins"/>
  <text x="38" y="78" class="t">Insumos publicados</text>
  <text x="38" y="102" class="s">ERA5T de T−2 (9 campos)</text>
  <text x="38" y="122" class="s">CFSv2 lead 1,5</text>
  <text x="38" y="142" class="s">GEFS da última quarta</text>
  <text x="38" y="162" class="s">SEAS5 lead 1,5, 51 membros</text>
  <text x="38" y="190" class="s">nada publicado depois</text>
  <text x="38" y="208" class="s">da emissão entra</text>

  <rect x="248" y="52" width="196" height="196" rx="10" class="bx"/>
  <text x="262" y="78" class="t">Base O09M-T2</text>
  <text x="262" y="102" class="s">NNLS de 4 membros:</text>
  <text x="262" y="122" class="s">EOF atmosférico, célula,</text>
  <text x="262" y="142" class="s">climatologia 30 anos, CFSv2</text>
  <text x="262" y="166" class="s">+ correção GEFS escalada</text>
  <text x="262" y="190" class="s">+ clip em zero</text>

  <rect x="472" y="52" width="196" height="196" rx="10" class="bx"/>
  <text x="486" y="78" class="t">B0-T2 (S6R causal)</text>
  <text x="486" y="102" class="s">P + Σ W(região, estação)·cₖ</text>
  <text x="486" y="126" class="s">LightGBM no resíduo</text>
  <text x="486" y="146" class="s">ridge H6 · MOS do SEAS5</text>
  <text x="486" y="170" class="s">dobras expansivas por ano,</text>
  <text x="486" y="190" class="s">κ e α por seleção interna</text>

  <rect x="696" y="52" width="196" height="196" rx="10" class="bx"/>
  <text x="710" y="78" class="t">Distribuição</text>
  <text x="710" y="102" class="s">hurdle-Gamma com</text>
  <text x="710" y="122" class="s">média = B0-T2</text>
  <text x="710" y="146" class="s">k e p0 por rede de</text>
  <text x="710" y="166" class="s">contexto (M1-C)</text>
  <text x="710" y="190" class="s">CRPS −7,2% vs constante</text>

  <rect x="920" y="52" width="150" height="196" rx="10" class="bx"/>
  <text x="934" y="78" class="t">Dependência</text>
  <text x="934" y="102" class="s">Schaake shuffle</text>
  <text x="934" y="122" class="s">(ou ECC-Q)</text>
  <text x="934" y="146" class="s">51 cenários</text>
  <text x="934" y="170" class="s">CRPS regional</text>
  <text x="934" y="190" class="s">−24,6%</text>

  <rect x="1098" y="52" width="158" height="196" rx="10" class="out"/>
  <text x="1112" y="78" class="ot">Produto mensal</text>
  <text x="1112" y="102" class="os">média, quantis</text>
  <text x="1112" y="122" class="os">P(acima da clim.)</text>
  <text x="1112" y="142" class="os">cenários espaciais</text>
  <text x="1112" y="170" class="os">RMSE 1,7125</text>
  <text x="1112" y="190" class="os">(bloco cego 2025–26)</text>

  <path d="M220,150 L246,150" class="ln"/>
  <path d="M444,150 L470,150" class="ln"/>
  <path d="M668,150 L694,150" class="ln"/>
  <path d="M892,150 L918,150" class="ln"/>
  <path d="M1070,150 L1096,150" class="ln"/>

  <!-- trilha diária -->
  <text x="24" y="300" class="h">DIÁRIO · rodada 00 UTC · D0–D10 · alvo MERGE 0,5° (12–12 UTC)</text>
  <rect x="24" y="314" width="196" height="216" rx="10" class="ins"/>
  <text x="38" y="340" class="t">Fontes</text>
  <text x="38" y="364" class="s">GEFS (5 membros)</text>
  <text x="38" y="384" class="s">AIGEFS (IA, 5 membros)</text>
  <text x="38" y="404" class="s">GraphCastGFS (IA)</text>
  <text x="38" y="424" class="s">MONAN 10 km</text>
  <text x="38" y="444" class="s">GOES RRQPE (D0)</text>
  <text x="38" y="464" class="s">AWIPS-II / EDEX</text>
  <text x="38" y="492" class="s">clim. MERGE 2001–2019</text>

  <rect x="248" y="314" width="196" height="216" rx="10" class="bx"/>
  <text x="262" y="340" class="t">Agregação</text>
  <text x="262" y="364" class="s">APCP de 6 h → janelas</text>
  <text x="262" y="384" class="s">diárias 12–12 UTC</text>
  <text x="262" y="408" class="s">média de área para</text>
  <text x="262" y="428" class="s">a grade 0,5°</text>
  <text x="262" y="452" class="s">só blocos da América do Sul</text>
  <text x="262" y="472" class="s">(faixa de bytes)</text>

  <rect x="472" y="314" width="196" height="216" rx="10" class="bx"/>
  <text x="486" y="340" class="t">Cabeça diária</text>
  <text x="486" y="364" class="s">hurdle-Gamma por</text>
  <text x="486" y="384" class="s">lead × região × estação</text>
  <text x="486" y="408" class="s">μ linear (fontes, clim.)</text>
  <text x="486" y="428" class="s">p0 logístico, k por MV</text>
  <text x="486" y="452" class="s">M4D: só GEFS</text>
  <text x="486" y="472" class="s">Athon: GEFS + AIGEFS</text>

  <rect x="696" y="314" width="196" height="216" rx="10" class="bx"/>
  <text x="710" y="340" class="t">Dia corrente (D0)</text>
  <text x="710" y="364" class="s">GEFS 12 UTC da véspera</text>
  <text x="710" y="384" class="s">+ chuva GOES até</text>
  <text x="710" y="404" class="s">06 UTC de d0</text>
  <text x="710" y="428" class="s">CRPS −7,1% sobre</text>
  <text x="710" y="448" class="s">o GEFS sozinho</text>

  <rect x="920" y="314" width="150" height="216" rx="10" class="bx"/>
  <text x="934" y="340" class="t">Dependência</text>
  <text x="934" y="364" class="s">Schaake com</text>
  <text x="934" y="384" class="s">campos MERGE</text>
  <text x="934" y="404" class="s">passados</text>
  <text x="934" y="428" class="s">CRPS regional</text>
  <text x="934" y="448" class="s">−27%</text>

  <rect x="1098" y="314" width="158" height="216" rx="10" class="out"/>
  <text x="1112" y="340" class="ot">Produto diário</text>
  <text x="1112" y="364" class="os">μ, P(&gt; 10 mm)</text>
  <text x="1112" y="384" class="os">quantis, cenários</text>
  <text x="1112" y="412" class="os">vence o MONAN</text>
  <text x="1112" y="432" class="os">corrigido em 9/10</text>
  <text x="1112" y="452" class="os">leads</text>

  <path d="M220,422 L246,422" class="ln"/>
  <path d="M444,422 L470,422" class="ln"/>
  <path d="M668,422 L694,422" class="ln"/>
  <path d="M892,422 L918,422" class="ln"/>
  <path d="M1070,422 L1096,422" class="ln"/>

  <!-- validação -->
  <rect x="24" y="566" width="1232" height="112" rx="10" class="val"/>
  <text x="44" y="594" class="h">VALIDAÇÃO</text>
  <text x="44" y="620" class="s">pré-registro com sha256 antes de qualquer métrica · dobras cronológicas expansivas · seleção de hiperparâmetros só com o passado</text>
  <text x="44" y="642" class="s">bloco cego 2025-01..2026-06 aberto uma vez · emissões prospectivas registradas antes da verdade · bootstrap por blocos de meses ou rodadas</text>
  <text x="44" y="664" class="s">verdade alternativa (MERGE) como sensibilidade · trava de execução exclusiva e escrita atômica de artefatos</text>
</svg>
