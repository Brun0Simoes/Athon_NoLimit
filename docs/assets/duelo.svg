<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="Duelo Athon contra MONAN">
<title>Duelo Athon contra MONAN</title>
<defs><filter id="brilho" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="varredura" x1="0" x2="1" y1="0" y2="0" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="3.2s" repeatCount="indefinite"/></linearGradient>
<marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a7"/></marker>
<style>
  text { font-family: 'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace; }
  .tit { font-size: 14px; font-weight: 700; }
  .sub { font-size: 11px; fill: #8b93a7; }
  .lab { font-size: 11px; fill: #8b93a7; letter-spacing: .5px; }
  .conn { fill: none; stroke-width: 1.6; stroke-dasharray: 6 6; animation: flui 1.4s linear infinite; }
  .glow { animation: pulsa 3.2s ease-in-out infinite; }
  .varre { mix-blend-mode: screen; }
  .cursor { animation: pisca 1s steps(1) infinite; }
  @keyframes flui { to { stroke-dashoffset: -24; } }
  @keyframes pulsa { 0%, 100% { opacity: .18; } 50% { opacity: .65; } }
  @keyframes pisca { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .conn, .glow, .cursor { animation: none !important; } .varre { display: none; } }
</style></defs>
